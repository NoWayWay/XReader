
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: unzip -o ReaderApp-source.zip

      - name: Install Gradle 8.9
        run: |
          set -e
          curl -fL \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 5 \
            https://downloads.gradle.org/distributions/gradle-8.9-bin.zip \
            -o /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"
          /opt/gradle-8.9/bin/gradle --version


      - name: Build APK
        run: |
          cd ReaderApp
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: readerapp-debug-apk
          path: ReaderApp/app/build/outputs/apk/debug/app-debug.apk
