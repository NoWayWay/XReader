
name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check source archive
        shell: bash
        run: |
          set -euo pipefail
          ls -lah
          test -f ReaderApp-source.zip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          unzip -o ReaderApp-source.zip
          test -f ReaderApp/settings.gradle.kts
          test -f ReaderApp/app/build.gradle.kts

      - name: Build APK with Docker
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"

          docker pull gradle:8.9-jdk17

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --env GRADLE_USER_HOME=/tmp/gradle-cache \
            --env ANDROID_HOME=/opt/android-sdk \
            --env ANDROID_SDK_ROOT=/opt/android-sdk \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$SDK_ROOT:/opt/android-sdk:ro" \
            --workdir /workspace \
            gradle:8.9-jdk17 \
            gradle --no-daemon --stacktrace -p ReaderApp assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="ReaderApp/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReaderApp-APK
          path: ReaderApp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

